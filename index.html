<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Size It Up! - Pop Culture Scale & English Learning</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header { text-align: center; margin-bottom: 12px; }
    h1 { margin: 0 0 4px 0; color: #f1f5f9; font-size: 1.7rem; }
    .subtitle { color: #94a3b8; font-size: 0.9rem; }

    .game-container {
      background: #1e293b;
      border-radius: 12px;
      padding: 18px;
      max-width: 1000px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .game-header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    /* ---------- Stage ---------- */
    .comparison-stage {
      height: clamp(380px, 58vh, 700px);
      background: #0b0f19;
      border-radius: 8px;
      position: relative;
      border: 1px solid #334155;
      overflow: hidden;
      user-select: none;
    }

    #bg-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .zoom-controls {
      position: absolute;
      top: 12px; right: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
    }

    .btn-zoom {
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      width: 38px; height: 38px;
      border-radius: 8px;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: background 0.2s, border-color 0.2s;
      font-size: 1rem;
    }
    .btn-zoom:hover { background: #334155; border-color: #38bdf8; }
    .btn-zoom svg {
      width: 20px; height: 20px;
      fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* ---------- Characters ---------- */
    .char {
      position: absolute;
      transform: translateX(-50%);
      cursor: grab;
      touch-action: none;
    }
    .char.dragging { cursor: grabbing; }
    /* bigger invisible grab area so tiny characters stay draggable */
    .char::after { content: ""; position: absolute; inset: -10px; }

    .char img {
      display: block;
      width: auto;
      max-width: none;
      max-height: none;
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: none;
    }

    .char.ref { z-index: 4; }
    .char.sil { z-index: 3; pointer-events: none; }
    .char.adj { z-index: 5; }

    .char.ref img { filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6)); }
    .char.adj img { filter: drop-shadow(0 0 8px rgba(248, 113, 113, 0.7)); }
    .char.adj.locked img { opacity: 0.8; }

    /* Silhouette showing the correct size */
    .char.sil img {
      filter: brightness(0) invert(1) drop-shadow(0 0 5px #34d399);
      opacity: 0.5;
    }
    .char.sil::before {
      content: "";
      position: absolute;
      left: -40px; right: -40px; top: 0;
      border-top: 2px dashed #34d399;
    }
    .char.sil::after { display: none; }

    .tag {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 6px;
      white-space: nowrap;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.88);
      pointer-events: none;
      z-index: 6;
    }
    .tag.ref-tag { color: #38bdf8; }
    .tag.adj-tag { color: #f87171; }
    .tag.sil-tag {
      top: auto; bottom: 100%;
      margin: 0 0 8px 0;
      color: #34d399;
      font-size: 0.85rem;
    }

    .resize-handle {
      position: absolute;
      top: -16px; right: -16px;
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      width: 34px; height: 34px;
      border-radius: 8px;
      display: flex; justify-content: center; align-items: center;
      cursor: ns-resize;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      font-size: 16px;
      transition: background 0.2s, border-color 0.2s;
      z-index: 10;
    }
    .resize-handle:hover { background: #334155; border-color: #f87171; }

    /* ---------- Controls ---------- */
    .controls-panel { margin-top: 15px; display: flex; flex-direction: column; gap: 12px; }

    .instruction-text { font-size: 1rem; text-align: center; line-height: 1.6; }
    .ref-text { color: #38bdf8; font-weight: 700; }
    .adj-text { color: #f87171; font-weight: 700; }
    .hint { color: #94a3b8; font-size: 0.85rem; }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background: #0f172a;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .quick-scale-btns { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .quick-label { font-size: 0.8rem; color: #94a3b8; margin-right: 4px; }

    .btn-small {
      background: #334155; color: white; border: none;
      padding: 6px 11px; border-radius: 4px; cursor: pointer;
      font-weight: bold; font-size: 0.82rem;
    }
    .btn-small:hover { background: #475569; }
    .btn-small.reset { background: #1e3a5f; }
    .btn-small.reset:hover { background: #24497a; }

    .btn {
      background: #ef4444; color: white; border: none;
      padding: 10px 24px; font-size: 1rem; font-weight: bold;
      border-radius: 6px; cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background: #dc2626; }
    .btn-next { background: #10b981; display: none; }
    .btn-next:hover { background: #059669; }

    /* ---------- Result ---------- */
    .result-box {
      margin-top: 15px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px 18px;
      display: none;
      align-items: center;
      gap: 18px;
    }
    .result-pct { font-size: 3rem; font-weight: 800; min-width: 130px; text-align: center; line-height: 1; }
    .result-main { flex: 1; }
    .result-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
    .result-detail { font-size: 1rem; color: #cbd5e1; line-height: 1.5; }
    .meter { height: 10px; background: #1e293b; border-radius: 6px; margin-top: 10px; overflow: hidden; }
    .meter-fill { height: 100%; width: 0; border-radius: 6px; transition: width 0.7s ease; }
    .legend-sil { color: #34d399; font-weight: 700; }

    /* ---------- Grammar (bigger) ---------- */
    .grammar-box {
      margin-top: 15px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      display: none;
    }
    .grammar-box h3 {
      margin: 0 0 14px 0;
      color: #fbbf24;
      font-size: 1.4rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }
    .sentence-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .sentence-item {
      background: #1e293b;
      padding: 16px 20px;
      border-radius: 8px;
      font-size: 1.6rem;
      line-height: 1.4;
      border-left: 6px solid #fbbf24;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .sentence-item.show { opacity: 1; transform: translateY(0); }
    .highlight-grammar { color: #fbbf24; font-weight: 800; }

    .btn-step {
      background: #3b82f6; color: white; border: none;
      padding: 11px 22px; border-radius: 8px;
      font-weight: bold; cursor: pointer; font-size: 1.05rem;
    }
    .btn-step:hover { background: #2563eb; }

    @media (max-width: 640px) {
      .sentence-item { font-size: 1.3rem; }
      .result-box { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Size It Up! 📏 Pop Culture Edition</h1>
    <div class="subtitle">Drag any character to move it · drag the ↗ handle to resize the red one · scroll or use + / − to zoom · the grid is always real cm &amp; m</div>
  </header>

  <div class="game-container">
    <div class="game-header-info">
      <div id="round-indicator">ROUND 1 / 8</div>
      <div id="score-display" style="color: #fbbf24; font-weight: bold;">SCORE: 0</div>
    </div>

    <div class="comparison-stage" id="stage">
      <canvas id="bg-canvas"></canvas>

      <!-- Reference character (blue) - can be moved, not resized -->
      <div class="char ref" id="wrap-ref">
        <img id="img-ref" alt="Reference Character" draggable="false">
        <div class="tag ref-tag" id="tag-ref"></div>
      </div>

      <!-- Silhouette of the correct size (shown after Lock In) -->
      <div class="char sil" id="wrap-sil" style="display:none;">
        <img id="img-sil" alt="Correct size silhouette" draggable="false">
        <div class="tag sil-tag" id="tag-sil"></div>
      </div>

      <!-- Resizable character (red) -->
      <div class="char adj" id="wrap-adj">
        <img id="img-adj" alt="Adjustable Character" draggable="false">
        <div class="tag adj-tag" id="tag-adj"></div>
        <div class="resize-handle" id="resize-btn" title="Drag up / down to resize">↗</div>
      </div>

      <div class="zoom-controls">
        <button class="btn-zoom" id="btn-zoom-in" title="Zoom In">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>
        <button class="btn-zoom" id="btn-zoom-out" title="Zoom Out">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>
        <button class="btn-zoom" id="btn-fit" title="Fit view">⤢</button>
      </div>
    </div>

    <div class="controls-panel">
      <div class="instruction-text">
        Reference: <span class="ref-text" id="name-ref-label"></span> <span class="hint" id="ref-height-label"></span><br>
        Yours: <span class="adj-text" id="name-adj-label"></span> <span class="hint" id="adj-height-label"></span>
      </div>

      <div class="action-row">
        <div class="quick-scale-btns">
          <span class="quick-label">Set to × reference:</span>
          <button class="btn-small" data-mult="0.5">0.5×</button>
          <button class="btn-small" data-mult="1">1×</button>
          <button class="btn-small" data-mult="2">2×</button>
          <button class="btn-small" data-mult="5">5×</button>
          <button class="btn-small" data-mult="20">20×</button>
          <button class="btn-small" data-mult="50">50×</button>
          <button class="btn-small reset" id="btn-reset">↺ Reset positions</button>
        </div>
        <div>
          <button class="btn" id="btn-lock">Lock In</button>
          <button class="btn btn-next" id="btn-next">Next Pair ➡️</button>
        </div>
      </div>
    </div>

    <div class="result-box" id="result-box">
      <div class="result-pct" id="result-pct">0%</div>
      <div class="result-main">
        <div class="result-title" id="result-title"></div>
        <div class="result-detail" id="result-detail"></div>
        <div class="meter"><div class="meter-fill" id="meter-fill"></div></div>
      </div>
    </div>

    <div class="grammar-box" id="grammar-box">
      <h3>💡 English Grammar &amp; Size Insights</h3>
      <div class="sentence-list" id="sentence-container"></div>
      <button class="btn-step" id="btn-reveal">Click for next sentence ➕</button>
    </div>
  </div>

  <script>
    // ------------------------------------------------------------------
    // DATA - fixed round order. Heights are in feet; converted to metres.
    // ------------------------------------------------------------------
    const FT = 0.3048;

    const rounds = [
      { ref: "Hello Kitty",  refFt: 1.2, refImg: "Hello Kitty.png",
        adj: "Smurf",        adjFt: 1.0, adjImg: "Smurf.png",     similar: true  },
      { ref: "Pikachu",      refFt: 1.3, refImg: "Pikachu.png",
        adj: "Baby Yoda",    adjFt: 1.1, adjImg: "Baby Yoda.png", similar: true  },
      { ref: "Kevin",        refLabel: "Kevin (Minion)", refFt: 3.5, refImg: "Kevin.png",
        adj: "Mario",        adjFt: 5.1, adjImg: "Mario.png",     similar: false },
      { ref: "Mickey Mouse", refFt: 2.3, refImg: "Mickey Mouse.png",
        adj: "Bart",         adjFt: 3.0, adjImg: "Bart.png",      similar: true  },
      { ref: "Spider-Man",   refFt: 5.8, refImg: "Spider_Man.png",
        adj: "Iron Man",     adjFt: 6.0, adjImg: "Iron Man.png",  similar: true  },
      { ref: "Yoda",         refFt: 2.2, refImg: "Yoda.png",
        adj: "Shrek",        adjFt: 7.0, adjImg: "Shrek.png",     similar: false },
      { ref: "Homer Simpson",refFt: 6.0, refImg: "Homer Simpson.png",
        adj: "Godzilla",     adjFt: 350, adjImg: "Godzilla.png",  similar: false },
      { ref: "Mickey Mouse", refFt: 2.3, refImg: "Mickey Mouse.png",
        adj: "Baymax",       adjFt: 6.5, adjImg: "Baymax.png",    similar: false }
    ];

    const adjectivesTall = ["tall", "big", "large", "huge"];
    const adjectivesSmall = ["small", "tiny", "short", "little"];

    // ------------------------------------------------------------------
    // STATE
    // ------------------------------------------------------------------
    const FLOOR_MARGIN = 44;      // px between floor line and bottom of stage
    const RULER_W = 66;           // px width of left ruler strip
    const STEPS = [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];

    let currentIndex = 0;
    let score = 0;
    let locked = false;
    let sentenceQueue = [];
    let currentSentenceIndex = 0;

    let ppm = 100;                // pixels per metre  (THE real scale)
    let refM = 1, trueM = 1;      // real heights in metres
    const ref = { x: 0, y: 0 };   // x: metres from centre, y: metres above floor
    const adj = { x: 0, y: 0, h: 1 };   // adj.h: the player's chosen height in metres
    let W = 0, H = 0, floorY = 0;

    // ------------------------------------------------------------------
    // ELEMENTS
    // ------------------------------------------------------------------
    const $ = (id) => document.getElementById(id);
    const stage = $("stage"), canvas = $("bg-canvas"), ctx = canvas.getContext("2d");
    const wrapRef = $("wrap-ref"), wrapAdj = $("wrap-adj"), wrapSil = $("wrap-sil");
    const imgRef = $("img-ref"), imgAdj = $("img-adj"), imgSil = $("img-sil");
    const tagRef = $("tag-ref"), tagAdj = $("tag-adj"), tagSil = $("tag-sil");
    const resizeBtn = $("resize-btn");
    const roundIndicator = $("round-indicator"), scoreDisplay = $("score-display");
    const btnLock = $("btn-lock"), btnNext = $("btn-next"), btnReveal = $("btn-reveal");
    const grammarBox = $("grammar-box"), sentenceContainer = $("sentence-container");
    const resultBox = $("result-box");

    // ------------------------------------------------------------------
    // HELPERS
    // ------------------------------------------------------------------
    function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // Height read-out, e.g. "37 cm", "1.55 m", "106.7 m"
    function fmtHeight(m) {
      if (m < 1) { const cm = m * 100; return cm.toFixed(cm < 10 ? 1 : 0) + " cm"; }
      if (m < 10) return m.toFixed(2) + " m";
      if (m < 100) return m.toFixed(1) + " m";
      return Math.round(m) + " m";
    }
    // Ruler tick label, trailing zeros stripped
    function fmtTick(m) {
      if (m < 1) return +(m * 100).toFixed(1) + " cm";
      return +m.toFixed(2) + " m";
    }

    function placeholderSrc(label) {
      const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='120' height='300' viewBox='0 0 120 300'>" +
        "<rect x='6' y='6' width='108' height='288' rx='20' fill='#475569'/>" +
        "<text x='60' y='155' font-size='16' fill='white' text-anchor='middle' font-family='Arial'>" + label + "</text></svg>";
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }
    function setImg(img, src, label) {
      img.onerror = () => { img.onerror = null; img.src = placeholderSrc(label); };
      img.src = src;
    }

    // Keep the zoom within sane limits (never let an image get absurdly large)
    function clampPpm(p) {
      let maxH = Math.max(refM, adj.h, locked ? trueM : 0);
      const upper = Math.min(3000, 7000 / maxH);
      return Math.max(0.3, Math.min(p, Math.max(upper, 0.3)));
    }
    function clampPos(o) {
      const xMax = (W / 2) / ppm * 1.1;
      o.x = Math.max(-xMax, Math.min(xMax, o.x));
      o.y = Math.max(0, Math.min((floorY) / ppm, o.y));
    }

    // ------------------------------------------------------------------
    // BACKGROUND (grid + ruler in real cm / m - always drawn from ppm)
    // ------------------------------------------------------------------
    function drawBackground() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);

      // choose a "nice" grid step so major squares are ~48-120px wide
      let step = STEPS[STEPS.length - 1];
      for (const s of STEPS) { if (s * ppm >= 48) { step = s; break; } }
      const minor = step / 5;
      const cx = W / 2;

      // minor grid
      if (minor * ppm >= 7) {
        ctx.strokeStyle = "rgba(255,255,255,0.035)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 1; floorY - i * minor * ppm >= 0; i++) {
          if (i % 5 === 0) continue;
          const y = Math.round(floorY - i * minor * ppm) + 0.5;
          ctx.moveTo(RULER_W, y); ctx.lineTo(W, y);
        }
        for (let i = -Math.ceil(cx / (minor * ppm)); i <= Math.ceil(cx / (minor * ppm)); i++) {
          if (i % 5 === 0) continue;
          const x = Math.round(cx + i * minor * ppm) + 0.5;
          if (x < RULER_W) continue;
          ctx.moveTo(x, 0); ctx.lineTo(x, floorY);
        }
        ctx.stroke();
      }

      // major grid
      ctx.strokeStyle = "rgba(255,255,255,0.10)";
      ctx.beginPath();
      for (let i = 1; floorY - i * step * ppm >= 0; i++) {
        const y = Math.round(floorY - i * step * ppm) + 0.5;
        ctx.moveTo(RULER_W, y); ctx.lineTo(W, y);
      }
      for (let i = -Math.ceil(cx / (step * ppm)); i <= Math.ceil(cx / (step * ppm)); i++) {
        const x = Math.round(cx + i * step * ppm) + 0.5;
        if (x < RULER_W) continue;
        ctx.moveTo(x, 0); ctx.lineTo(x, floorY);
      }
      ctx.stroke();

      // floor line
      ctx.save();
      ctx.strokeStyle = "#38bdf8";
      ctx.shadowColor = "#38bdf8";
      ctx.shadowBlur = 8;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.stroke();
      ctx.restore();

      // ruler strip
      ctx.fillStyle = "rgba(15,23,42,0.92)";
      ctx.fillRect(0, 0, RULER_W, H);
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.beginPath(); ctx.moveTo(RULER_W + 0.5, 0); ctx.lineTo(RULER_W + 0.5, H); ctx.stroke();

      ctx.font = "12px monospace";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      // ticks: every minor step (short) and every major step (long + label)
      if (minor * ppm >= 7) {
        ctx.strokeStyle = "rgba(148,163,184,0.5)";
        ctx.beginPath();
        for (let i = 1; floorY - i * minor * ppm >= 0; i++) {
          if (i % 5 === 0) continue;
          const y = Math.round(floorY - i * minor * ppm) + 0.5;
          ctx.moveTo(RULER_W - 6, y); ctx.lineTo(RULER_W, y);
        }
        ctx.stroke();
      }
      ctx.fillStyle = "#94a3b8";
      ctx.strokeStyle = "#94a3b8";
      ctx.beginPath();
      for (let i = 1; floorY - i * step * ppm >= 8; i++) {
        const y = Math.round(floorY - i * step * ppm) + 0.5;
        ctx.moveTo(RULER_W - 12, y); ctx.lineTo(RULER_W, y);
      }
      ctx.stroke();
      for (let i = 1; floorY - i * step * ppm >= 8; i++) {
        const y = floorY - i * step * ppm;
        ctx.fillText(fmtTick(i * step), RULER_W - 15, y);
      }
      ctx.fillStyle = "#38bdf8";
      ctx.fillText("0", RULER_W - 15, floorY - 8);

      // grid note (top-left, next to ruler)
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillStyle = "#64748b";
      ctx.font = "12px monospace";
      ctx.fillText("1 square = " + fmtTick(step), RULER_W + 10, 10);

      // scale bar (bottom-right)
      let bar = STEPS[0];
      for (const s of STEPS) { if (s * ppm <= 160) bar = s; }
      const barPx = bar * ppm;
      const bx = W - 20 - barPx, by = H - 18;
      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bx, by - 5); ctx.lineTo(bx, by);
      ctx.lineTo(bx + barPx, by); ctx.lineTo(bx + barPx, by - 5);
      ctx.stroke();
      ctx.fillStyle = "#e2e8f0";
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.fillText(fmtTick(bar), bx + barPx / 2, by - 6);
      ctx.lineWidth = 1;
    }

    // ------------------------------------------------------------------
    // LAYOUT - everything positioned from real metres * ppm
    // ------------------------------------------------------------------
    function place(wrap, img, hM, xM, yM) {
      const h = Math.max(1, hM * ppm);
      img.style.height = h + "px";
      wrap.style.left = (W / 2 + xM * ppm) + "px";
      wrap.style.top = (floorY - yM * ppm - h) + "px";
    }

    function layout() {
      W = stage.clientWidth;
      H = stage.clientHeight;
      floorY = H - FLOOR_MARGIN;
      clampPos(ref); clampPos(adj);

      drawBackground();
      place(wrapRef, imgRef, refM, ref.x, ref.y);
      place(wrapAdj, imgAdj, adj.h, adj.x, adj.y);
      if (locked) {
        place(wrapSil, imgSil, trueM, adj.x, adj.y);
      }
      updateReadouts();
    }

    function updateReadouts() {
      const r = rounds[currentIndex];
      tagRef.textContent = (r.refLabel || r.ref) + " · " + fmtHeight(refM);
      tagAdj.textContent = r.adj + " · " + fmtHeight(adj.h);
      $("ref-height-label").textContent = "— " + fmtHeight(refM) + " tall";
      const mult = adj.h / refM;
      $("adj-height-label").textContent = "— " + fmtHeight(adj.h) + " (" +
        (mult >= 10 ? mult.toFixed(0) : mult.toFixed(2)) + "× the reference)";
    }

    // ------------------------------------------------------------------
    // ZOOM
    // ------------------------------------------------------------------
    function zoom(factor) {
      ppm = clampPpm(ppm * factor);
      layout();
    }
    function fitView(includeTrue) {
      const needed = Math.max(refM, adj.h, includeTrue ? trueM : 0);
      ppm = clampPpm((floorY - 80) / (needed * 1.05));
      layout();
    }

    $("btn-zoom-in").addEventListener("click", () => zoom(1.3));
    $("btn-zoom-out").addEventListener("click", () => zoom(1 / 1.3));
    $("btn-fit").addEventListener("click", () => fitView(locked));
    stage.addEventListener("wheel", (e) => {
      e.preventDefault();
      zoom(Math.exp(-e.deltaY * 0.0012));
    }, { passive: false });

    // ------------------------------------------------------------------
    // DRAG (move any character) + RESIZE (red one only)
    // ------------------------------------------------------------------
    let drag = null;

    function beginMove(e, obj, wrap) {
      drag = { type: "move", obj, wrap, sx: e.clientX, sy: e.clientY, ox: obj.x, oy: obj.y };
      wrap.classList.add("dragging");
      e.preventDefault();
    }
    wrapRef.addEventListener("pointerdown", (e) => beginMove(e, ref, wrapRef));
    wrapAdj.addEventListener("pointerdown", (e) => {
      if (e.target === resizeBtn) {
        if (locked) return;
        drag = { type: "resize", sy: e.clientY, sh: adj.h * ppm };
        e.preventDefault();
      } else {
        beginMove(e, adj, wrapAdj);
      }
    });

    window.addEventListener("pointermove", (e) => {
      if (!drag) return;
      if (drag.type === "move") {
        drag.obj.x = drag.ox + (e.clientX - drag.sx) / ppm;
        drag.obj.y = drag.oy - (e.clientY - drag.sy) / ppm;
      } else {
        const newPx = drag.sh + (drag.sy - e.clientY);
        const minM = Math.max(0.01, 3 / ppm);
        const maxM = Math.min(1000, 7000 / ppm);
        adj.h = Math.max(minM, Math.min(maxM, newPx / ppm));
      }
      layout();
    });
    function endDrag() {
      if (!drag) return;
      if (drag.wrap) drag.wrap.classList.remove("dragging");
      drag = null;
    }
    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);

    // Presets: set red height to N x the reference
    document.querySelectorAll("[data-mult]").forEach((b) => {
      b.addEventListener("click", () => {
        if (locked) return;
        const m = parseFloat(b.dataset.mult);
        adj.h = Math.max(0.01, Math.min(1000, refM * m));
        ppm = clampPpm(ppm);
        layout();
      });
    });

    $("btn-reset").addEventListener("click", () => {
      ref.x = -0.18 * W / ppm; adj.x = 0.18 * W / ppm;
      ref.y = 0; adj.y = 0;
      layout();
    });

    // ------------------------------------------------------------------
    // ROUND FLOW
    // ------------------------------------------------------------------
    function loadRound(index) {
      const r = rounds[index];
      locked = false;

      refM = r.refFt * FT;
      trueM = r.adjFt * FT;
      adj.h = refM * 0.8;

      setImg(imgRef, r.refImg, r.ref);
      setImg(imgAdj, r.adjImg, r.adj);
      setImg(imgSil, r.adjImg, r.adj);

      $("name-ref-label").textContent = r.refLabel || r.ref;
      $("name-adj-label").textContent = r.adj;

      wrapSil.style.display = "none";
      wrapAdj.classList.remove("locked");
      resizeBtn.style.display = "flex";

      roundIndicator.textContent = "ROUND " + (index + 1) + " / " + rounds.length;
      grammarBox.style.display = "none";
      resultBox.style.display = "none";
      btnLock.style.display = "inline-block";
      btnNext.style.display = "none";
      btnReveal.style.display = "inline-block";
      sentenceContainer.innerHTML = "";

      W = stage.clientWidth; H = stage.clientHeight; floorY = H - FLOOR_MARGIN;
      ppm = clampPpm((floorY - 80) / (Math.max(refM, trueM) * 1.05));
      ref.x = -0.18 * W / ppm; adj.x = 0.18 * W / ppm;
      ref.y = 0; adj.y = 0;
      layout();
    }

    function lockAnswer() {
      locked = true;
      resizeBtn.style.display = "none";
      wrapAdj.classList.add("locked");

      // --- closeness score (symmetric on a log scale: 2x too big == 2x too small)
      const ratio = adj.h / trueM;
      const err = Math.abs(Math.log(ratio));
      const pct = Math.max(0, 1 - err / Math.log(4)) * 100;
      const pctR = Math.round(pct);
      score += pctR;
      scoreDisplay.textContent = "SCORE: " + score + " / " + (rounds.length * 100);

      // --- silhouette of the correct size, anchored to the red character
      wrapSil.style.display = "block";
      tagSil.textContent = "✔ Real size: " + fmtHeight(trueM);
      // zoom out (never in) so the player, the silhouette and the reference all fit
      const needed = Math.max(refM, adj.h, trueM);
      ppm = clampPpm(Math.min(ppm, (floorY - 80) / (needed * 1.05)));
      layout();

      showResult(pctR, ratio);

      const r = rounds[currentIndex];
      buildSentences(r);
      grammarBox.style.display = "block";
      btnLock.style.display = "none";
      btnNext.style.display = "inline-block";
      currentSentenceIndex = 0;
      revealNextSentence();
    }

    function showResult(p, ratio) {
      const r = rounds[currentIndex];
      let title, color;
      if (p >= 92) { title = "🎯 Spot on!"; color = "#34d399"; }
      else if (p >= 80) { title = "👏 Very close!"; color = "#34d399"; }
      else if (p >= 60) { title = "👍 Not bad!"; color = "#fbbf24"; }
      else if (p >= 30) { title = "🤔 Off by quite a bit"; color = "#fb923c"; }
      else { title = "😮 Way off!"; color = "#f87171"; }

      const diffPct = Math.abs(ratio - 1) * 100;
      let dir;
      if (diffPct < 2) dir = "almost perfect";
      else if (ratio < 1) dir = diffPct.toFixed(0) + "% too small";
      else dir = diffPct.toFixed(0) + "% too big";

      $("result-pct").textContent = p + "%";
      $("result-pct").style.color = color;
      $("result-title").textContent = title;
      $("result-title").style.color = color;
      $("result-detail").innerHTML =
        "You made " + r.adj + " <b>" + fmtHeight(adj.h) + "</b> tall — the real size is <b>" +
        fmtHeight(trueM) + "</b> (" + dir + "). The <span class='legend-sil'>green silhouette</span> shows the correct size.";
      const fill = $("meter-fill");
      fill.style.background = color;
      fill.style.width = "0";
      requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = p + "%"; }));
      resultBox.style.display = "flex";
    }

    function buildSentences(r) {
      sentenceQueue = [];
      const adjBig = getRandomItem(adjectivesTall);
      const adjSmall = getRandomItem(adjectivesSmall);
      const A = r.adj, R = r.ref;

      if (r.similar) {
        sentenceQueue.push(`1. ${A} is <span class="highlight-grammar">as ${adjBig} as</span> ${R}.`);
        sentenceQueue.push(`2. In size, ${A} is <span class="highlight-grammar">somewhat like</span> ${R}.`);
        sentenceQueue.push(`3. ${A}'s scale is not very <span class="highlight-grammar">different from</span> ${R}.`);
      } else if (r.adjFt > r.refFt) {
        sentenceQueue.push(`1. ${A} is <span class="highlight-grammar">not as ${adjSmall} as</span> ${R}.`);
        sentenceQueue.push(`2. ${A} is completely <span class="highlight-grammar">different from</span> ${R} in height!`);
        sentenceQueue.push(`3. ${A} is <span class="highlight-grammar">not like</span> ${R} because it is much <span class="highlight-grammar">${adjBig}</span>!`);
      } else {
        sentenceQueue.push(`1. ${A} is <span class="highlight-grammar">not as ${adjBig} as</span> ${R}.`);
        sentenceQueue.push(`2. ${A} is <span class="highlight-grammar">different from</span> ${R} in scale.`);
        sentenceQueue.push(`3. ${A} is <span class="highlight-grammar">somewhat like</span> a fraction of ${R}'s size!`);
      }
    }

    function revealNextSentence() {
      if (currentSentenceIndex < sentenceQueue.length) {
        const div = document.createElement("div");
        div.className = "sentence-item";
        div.innerHTML = sentenceQueue[currentSentenceIndex];
        sentenceContainer.appendChild(div);
        setTimeout(() => div.classList.add("show"), 50);
        currentSentenceIndex++;
        if (currentSentenceIndex >= sentenceQueue.length) btnReveal.style.display = "none";
      }
    }

    function nextPair() {
      currentIndex++;
      if (currentIndex < rounds.length) {
        loadRound(currentIndex);
      } else {
        const avg = Math.round(score / rounds.length);
        alert("🎉 Amazing job! You finished all rounds.\nTotal: " + score + " / " + (rounds.length * 100) +
              "  (average closeness " + avg + "%)");
        currentIndex = 0;
        score = 0;
        scoreDisplay.textContent = "SCORE: 0 / " + (rounds.length * 100);
        loadRound(0);
      }
    }

    btnLock.addEventListener("click", lockAnswer);
    btnNext.addEventListener("click", nextPair);
    btnReveal.addEventListener("click", revealNextSentence);

    // Keep the real scale correct when the window is maximised / minimised / resized
    new ResizeObserver(() => layout()).observe(stage);

    scoreDisplay.textContent = "SCORE: 0 / " + (rounds.length * 100);
    loadRound(0);
  </script>
</body>
</html>
